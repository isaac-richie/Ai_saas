<!doctype html><html><head><meta charset="utf-8"><title>Existing assets</title>
<style>
body{margin:0;background:#050505;color:#fff;font:13px -apple-system,Helvetica,sans-serif;padding:14px}
h1{font-size:14px;color:#22d3ee;margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
figure{margin:0;position:relative;border:1px solid rgba(255,255,255,.12);border-radius:8px;overflow:hidden;background:#0b0b0d}
img{display:block;width:100%;height:190px;object-fit:cover}
figcaption{position:absolute;left:0;right:0;bottom:0;padding:5px 7px;background:linear-gradient(transparent,rgba(0,0,0,.92));font-size:11px}
</style></head><body>
<h1>Existing assets already in /public</h1>
<div class="g" id="g"></div>
<script>
const f=["image1.jpeg","image2.jpeg","jpeg1.jpeg","jpeg2.jpeg","jpeg3.jpeg","jpeg4.jpeg","director.png","brand-logo.jpeg"];
document.getElementById('g').innerHTML=f.map(n=>`<figure><img src="/${n}"><figcaption>${n}</figcaption></figure>`).join('');
</script></body></html>
